<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilkul — Kitchen Display System (KDS / KOT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  :root {
    --ink: #1F2523;
    --paper: #F7F3E8;
    --paper2: #FBF8F0;
    --saffron: #E8A33D;
    --saffron-deep: #C9832A;
    --teal: #1D4E4A;
    --teal-deep: #153A37;
    --chili: #C1442E;
    --line: #C9CDBF;
    --line-soft: #DEDFD3;
    --ready-bg: #C6F6D5;
    --ready-text: #22543D;
    --ready-border: #9AE6B4;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    background: var(--teal-deep);
    color: var(--paper2);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand span {
    background: var(--saffron);
    color: var(--ink);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
  }
  .user-badge {
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn-logout {
    background: var(--chili);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* AUTH SCREEN */
  #authContainer {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 20px;
  }
  .auth-card {
    background: var(--paper2);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }
  .auth-card h2 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 28px;
    margin: 0 0 8px 0;
  }
  .auth-card p { font-size: 13px; color: #6B7370; margin-bottom: 20px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .form-field label { font-size: 12px; font-weight: 600; color: #6B7370; }
  .form-field input {
    padding: 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 14px; background: #fff;
  }
  .btn-login {
    background: var(--teal); color: #fff; border: none; border-radius: 4px; padding: 10px;
    width: 100%; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px;
  }
  .btn-login:hover { background: var(--teal-deep); }

  /* MAIN DISPLAY */
  #kdsContainer { padding: 20px; max-width: 1400px; margin: 0 auto; display: none; }
  
  .kds-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--line);
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 10px 20px;
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #6B7370;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.15s;
  }
  .tab-btn.active {
    color: var(--teal-deep);
    border-bottom-color: var(--teal);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .order-card {
    background: var(--paper2);
    border: 2px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0,0,0,0.04);
  }
  .order-card.urgent {
    border-color: var(--chili);
  }

  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .order-id {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--teal-deep);
  }
  .timer-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--paper);
    border: 1px solid var(--line);
  }
  .timer-badge.urgent {
    background: #FED7D7;
    color: #742A2A;
    border-color: #FEB2B2;
  }

  .order-items {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
    flex-grow: 1;
  }
  .order-items li {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line-soft);
    font-size: 15px;
  }
  .order-items li b { color: var(--teal-deep); font-size: 16px; }

  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: var(--line-soft);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--teal);
    transition: width 1s linear, background-color 0.3s;
  }

  .btn-ready {
    width: 100%;
    background: #276749;
    color: #FFF;
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-ready:hover { background: #1D4E3A; }

  .status-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    text-align: center;
  }
  .status-badge.ready { background: var(--ready-bg); color: var(--ready-text); border: 1px solid var(--ready-border); }
  .status-badge.cancelled { background: #FED7D7; color: #742A2A; border: 1px solid #FEB2B2; }

  .empty-msg {
    grid-column: 1 / -1;
    text-align: center;
    color: #6B7370;
    padding: 50px 20px;
    font-size: 16px;
  }
</style>
</head>
<body onclick="initAudioContext()">

<header>
  <div class="brand">
    BILKUL <span>MASTER KOT DISPLAY</span>
  </div>
  <div class="user-badge" id="userHeader" style="display:none;">
    <span id="userEmailDisplay">kitchen@store.com</span>
    <button class="btn-logout" onclick="logoutUser()">Logout</button>
  </div>
</header>

<!-- LOGIN SCREEN -->
<div id="authContainer">
  <div class="auth-card">
    <h2>Kitchen Terminal</h2>
    <p>Sign in with your store credentials to sync active kitchen orders in real time.</p>
    <div class="form-field">
      <label>Email Address</label>
      <input type="email" id="authEmail" placeholder="restaurant@example.com">
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="loginUser()">Login to KOT System</button>
  </div>
</div>

<!-- KDS DISPLAY PANEL -->
<div id="kdsContainer">
  <div class="kds-tabs">
    <button class="tab-btn active" id="tab-btn-preparing" onclick="switchSubTab('preparing')">Live Orders Queue</button>
    <button class="tab-btn" id="tab-btn-ready" onclick="switchSubTab('ready')">Completed / Ready Food</button>
  </div>

  <div class="grid" id="ordersGrid">
    <!-- Orders populate live here -->
  </div>
</div>

<script>
  // Same Firebase configuration as Bilkul Billing POS
  const firebaseConfig = {
    apiKey: "AIzaSyCziIy3OMaMT-s-d65q63bBfptE4MLC6rk",
    authDomain: "bilkul-95cf2.firebaseapp.com",
    databaseURL: "https://bilkul-95cf2-default-rtdb.firebaseio.com",
    projectId: "bilkul-95cf2",
    storageBucket: "bilkul-95cf2.firebasestorage.app",
    messagingSenderId: "827545459369",
    appId: "1:827545459369:web:3e86b9c800168a35b2e7b8",
    measurementId: "G-564X1M66DZ"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let currentUser = null;
  let activeOrders = [];
  let previousOrdersMap = null; // Track order states for sound triggers
  let currentSubTab = 'preparing';
  let timerInterval = null;

  // --- AUDIO ALERT SYSTEM ---
  let audioCtx = null;

  function initAudioContext() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playNewOrderSound() {
    initAudioContext();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    // Two-tone chime (High pleasant bell sound)
    [587.33, 880].forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + index * 0.15);

      gain.gain.setValueAtTime(0, now + index * 0.15);
      gain.gain.linearRampToValueAtTime(0.3, now + index * 0.15 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.15 + 0.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now + index * 0.15);
      osc.stop(now + index * 0.15 + 0.4);
    });
  }

  function playCancellationSound() {
    initAudioContext();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    // Lower descending tone for cancellation warning
    [440, 311.13].forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now + index * 0.2);

      gain.gain.setValueAtTime(0, now + index * 0.2);
      gain.gain.linearRampToValueAtTime(0.2, now + index * 0.2 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.2 + 0.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now + index * 0.2);
      osc.stop(now + index * 0.2 + 0.5);
    });
  }

  // Auth State Listener
  auth.onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('kdsContainer').style.display = 'block';
      document.getElementById('userHeader').style.display = 'flex';
      document.getElementById('userEmailDisplay').innerText = user.email;

      attachOrderListener(user.uid);
      startTimerLoop();
    } else {
      currentUser = null;
      previousOrdersMap = null;
      document.getElementById('authContainer').style.display = 'flex';
      document.getElementById('kdsContainer').style.display = 'none';
      document.getElementById('userHeader').style.display = 'none';
      if(timerInterval) clearInterval(timerInterval);
    }
  });

  function loginUser() {
    initAudioContext();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password) {
      alert("Please fill in both email and password.");
      return;
    }
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => alert("Login Error: " + err.message));
  }

  function logoutUser() {
    auth.signOut();
  }

  function attachOrderListener(uid) {
    db.ref(`users/${uid}/activeOrders`).on('value', snapshot => {
      const val = snapshot.val() || [];
      activeOrders = Array.isArray(val) ? val : Object.values(val);

      // Detect state changes for sound alerts
      const currentMap = {};
      activeOrders.forEach(o => {
        if (o && o.id) {
          currentMap[o.id] = o.status;
        }
      });

      if (previousOrdersMap !== null) {
        let hasNewBilledOrder = false;
        let hasCancelledOrder = false;

        // Check for new orders or status transitions
        Object.keys(currentMap).forEach(id => {
          const newStatus = currentMap[id];
          const oldStatus = previousOrdersMap[id];

          if (!oldStatus) {
            // New order received
            if (newStatus === 'preparing') {
              hasNewBilledOrder = true;
            } else if (newStatus === 'cancelled') {
              hasCancelledOrder = true;
            }
          } else if (oldStatus !== 'cancelled' && newStatus === 'cancelled') {
            // Existing order was cancelled
            hasCancelledOrder = true;
          }
        });

        if (hasCancelledOrder) {
          playCancellationSound();
        } else if (hasNewBilledOrder) {
          playNewOrderSound();
        }
      }

      previousOrdersMap = currentMap;
      renderOrders();
    });
  }

  function switchSubTab(tab) {
    currentSubTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-btn-${tab}`).classList.add('active');
    renderOrders();
  }

  function startTimerLoop() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (currentSubTab === 'preparing') {
        renderOrders();
      }
    }, 1000);
  }

  function renderOrders() {
    const grid = document.getElementById('ordersGrid');
    const now = Date.now();

    if (currentSubTab === 'preparing') {
      const prepOrders = activeOrders.filter(o => o.status === 'preparing');

      if (prepOrders.length === 0) {
        grid.innerHTML = '<div class="empty-msg">No active pending orders in the kitchen.</div>';
        return;
      }

      grid.innerHTML = prepOrders.map(order => {
        const elapsed = now - order.createdAt;
        const duration = order.durationMs || (12 * 60 * 1000);
        const remainingMs = Math.max(0, duration - elapsed);

        const remSec = Math.floor(remainingMs / 1000);
        const mins = Math.floor(remSec / 60);
        const secs = remSec % 60;
        const timerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        let progressPercent = Math.min(100, Math.max(0, (elapsed / duration) * 100));
        let barColor = 'var(--teal)';
        let isUrgent = false;

        if (progressPercent >= 75) {
          barColor = 'var(--chili)';
          isUrgent = true;
        } else if (progressPercent >= 50) {
          barColor = 'var(--saffron-deep)';
        }

        const itemsList = (order.items || []).map(item => `
          <li><span><b>${item.qty}x</b> ${item.name}</span></li>
        `).join('');

        return `
          <div class="order-card ${isUrgent ? 'urgent' : ''}">
            <div>
              <div class="order-header">
                <span class="order-id">${order.id}</span>
                <span class="timer-badge ${isUrgent ? 'urgent' : ''}">${timerText} rem</span>
              </div>
              <ul class="order-items">
                ${itemsList}
              </ul>
            </div>
            <div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${progressPercent}%; background-color: ${barColor};"></div>
              </div>
              <button class="btn-ready" onclick="markReady('${order.id}')">FOOD READY</button>
            </div>
          </div>
        `;
      }).join('');

    } else {
      const readyOrders = activeOrders.filter(o => o.status === 'ready' || o.status === 'cancelled').reverse();

      if (readyOrders.length === 0) {
        grid.innerHTML = '<div class="empty-msg">No completed or ready orders yet.</div>';
        return;
      }

      grid.innerHTML = readyOrders.map(order => {
        const timeStr = new Date(order.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const itemsList = (order.items || []).map(item => `
          <li><span><b>${item.qty}x</b> ${item.name}</span></li>
        `).join('');

        const isReady = order.status === 'ready';
        const statusClass = isReady ? 'ready' : 'cancelled';
        const statusText = isReady ? 'FOOD READY' : 'CANCELLED';

        return `
          <div class="order-card">
            <div>
              <div class="order-header">
                <span class="order-id">${order.id}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
              </div>
              <p style="font-size:12px; color:#6B7370; margin:-4px 0 10px 0;">Time: ${timeStr}</p>
              <ul class="order-items">
                ${itemsList}
              </ul>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  function markReady(orderId) {
    const order = activeOrders.find(o => o.id === orderId);
    if (order) {
      order.status = 'ready';
      db.ref(`users/${currentUser.uid}/activeOrders`).set(activeOrders);
    }
  }
</script>

</body>
</html>
